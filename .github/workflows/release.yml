name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Expected vMAJOR.MINOR.PATCH tag.' }
          "APP_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/test.ps1
          ./scripts/verify-ui.ps1
      - name: Create portable ZIP and installer
        shell: pwsh
        run: |
          $compiler = ./scripts/get-inno.ps1
          ./scripts/package.ps1 -Version $env:APP_VERSION -InnoSetupCompiler $compiler -RequireInstaller
      - name: Publish draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $folder = "artifacts/release/$env:APP_VERSION"
          gh release create $env:RELEASE_TAG "$folder/UsageDock-$env:APP_VERSION-win-x64.zip" "$folder/UsageDock-$env:APP_VERSION-win-x64-setup.exe" "$folder/SHA256SUMS.txt" --draft --verify-tag --title "UsageDock $env:APP_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
