name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Tests and Core coverage gate
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Desktop smoke and render
        shell: pwsh
        run: ./scripts/verify-ui.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/tests/
            artifacts/ui/
